        <script>
            document.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('.zao').forEach(zao => {
                    zao.addEventListener('mouseenter', () => {
                        zao.classList.toggle('flipped');
                    });
                });

                const honk = document.querySelector('.honk');
                if (honk) {
                    honk.addEventListener('click', () => {
                        const overlay = document.createElement('div');
                        overlay.className = 'honk-overlay';
                        overlay.textContent = 'HONK!';
                        overlay.style.setProperty('--rot', `${(Math.random() * 50 - 25).toFixed(2)}deg`);
                        overlay.style.setProperty('--pos-x', `${(20 + Math.random() * 60).toFixed(2)}%`);
                        overlay.style.setProperty('--pos-y', `${(20 + Math.random() * 60).toFixed(2)}%`);
                        overlay.style.setProperty('--honk-size', `${(8 + Math.random() * 8).toFixed(2)}rem`);
                        document.body.appendChild(overlay);
                        setTimeout(() => overlay.remove(), 1800);
                    });
                }
            });
        </script>
